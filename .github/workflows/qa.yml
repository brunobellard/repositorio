# Qualidade: roda a cada push e pull request na main.
# - checks: typecheck, lint e testes das regras do app (sem banco; sempre rodam)
# - api: testes de permissão e regras no Supabase. Precisam dos segredos do repositório
#   (Settings > Secrets and variables > Actions). Sem eles, os testes são pulados.
#   Use SEMPRE uma conta de teste: os testes criam e apagam dados "QA ..." nela.
name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  api:
    runs-on: ubuntu-latest
    needs: checks
    # Um teste de API por vez: evita duas execuções mexendo na mesma conta de teste
    concurrency:
      group: qa-api
      cancel-in-progress: false
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      QA_STUDIO_SLUG: ${{ secrets.QA_STUDIO_SLUG }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api -- --ci
      # Sem segredos, os testes de API são todos pulados e o job fica verde sem testar nada: avisa no resumo
      - name: Avisar se faltam segredos
        if: env.QA_TEST_EMAIL == '' || env.QA_TEST_PASSWORD == '' || env.QA_STUDIO_SLUG == '' || env.EXPO_PUBLIC_SUPABASE_URL == ''
        run: |
          echo "::warning title=Testes de API incompletos::Faltam segredos do GitHub (EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY, QA_TEST_EMAIL, QA_TEST_PASSWORD, QA_STUDIO_SLUG). Os testes que dependem deles foram pulados."
